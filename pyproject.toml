[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralzip"
version = "0.1.0"
description = "Lossless model-weight compression with reusable setup."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "safetensors>=0.4",
    "torch",
    "transformers",
]

[project.optional-dependencies]
diffusion = [
    "diffusers",
]
gpu = [
    "accelerate>=1",
    "cupy-cuda12x>=13",
]
experiments = [
    "dfloat11==0.5.0",
    "huggingface-hub",
    "matplotlib",
    "pandas",
    "pillow",
    "pyarrow",
    "safetensors",
    "torchvision",
]
test = [
    "huggingface-hub",
    "matplotlib",
    "pandas",
    "pillow",
    "pytest",
    "torchvision",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralzip*"]

[tool.setuptools.package-data]
"neuralzip.gpu" = ["cuda/*.cu"]

[tool.setuptools.data-files]
"share/neuralzip/licenses/dfloat11" = ["third_party/dfloat11/LICENSE"]
"share/neuralzip/licenses/zstd" = [
    "third_party/zstd/LICENSE",
    "third_party/zstd/NEURALZIP_VENDOR_REVISION",
]
