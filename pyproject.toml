[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralzip"
version = "0.1.0"
description = "Lossless model-weight compression with reusable setup."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "safetensors>=0.4",
    "torch",
    "transformers",
]

[project.optional-dependencies]
diffusion = [
    "diffusers",
]
gpu = [
    "accelerate>=1",
    "cupy-cuda12x>=13",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralzip*"]

[tool.setuptools.package-data]
"neuralzip.gpu" = ["cuda/*.cu"]

[tool.setuptools.exclude-package-data]
neuralzip = ["*.cpp"]

[tool.setuptools.data-files]
"share/neuralzip/licenses/dfloat11" = ["third_party/dfloat11/LICENSE"]
"share/neuralzip/licenses/go" = ["third_party/go/LICENSE", "third_party/go/PATENTS"]
"share/neuralzip/licenses/klauspost-compress" = ["third_party/klauspost-compress/LICENSE"]
