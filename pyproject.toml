[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralzip"
version = "0.1.0"
description = "Lossless checkpoint compression experiments for foundation models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "transformers",
]

[project.optional-dependencies]
experiments = [
    "huggingface-hub",
    "matplotlib",
    "pandas",
    "pillow",
    "pyarrow",
    "safetensors",
    "torchvision",
    "zipnn==0.5.4",
]
test = [
    "huggingface-hub",
    "matplotlib",
    "pandas",
    "pillow",
    "pytest",
    "torchvision",
    "zipnn==0.5.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralzip*"]
