[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "neuralzip"
version = "0.1.0"
description = "Lossless model-weight compression with reusable setup."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "safetensors>=0.4",
    "torch",
    "transformers>=5.15,<6",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["neuralzip"]
wheel.exclude = ["neuralzip/native/*"]
sdist.include = [
    "CMakeLists.txt",
    "neuralzip/native/*.cpp",
    "neuralzip/native/*.inc",
    "neuralzip/gpu/cuda/*.cu",
    "neuralzip/codebooks/*.huff0",
    "third_party/dfloat11/LICENSE",
    "third_party/zstd/LICENSE",
    "third_party/zstd/UPSTREAM",
]

[tool.scikit-build.cmake.define]
CMAKE_OSX_DEPLOYMENT_TARGET = { env = "MACOSX_DEPLOYMENT_TARGET", default = "13.0" }
